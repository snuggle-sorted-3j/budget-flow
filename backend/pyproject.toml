[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "persistence: commits real data to verify survival across reconnection (requires live DB)",
    "backup: invokes shell backup/restore scripts via subprocess (requires pg_dump in PATH)",
]

[tool.bandit]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = "app/services/reconciliation_service.py"
runner = "python -m pytest tests/unit/test_reconciliation_service.py tests/unit/test_tax_benefits.py tests/integration/test_reconciliation.py -x -q --tb=no"


