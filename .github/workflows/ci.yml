name: BudgetFlow CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: budgetflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov sqlalchemy psycopg2-binary httpx fastapi pydantic-settings python-multipart python-jose[cryptography] passlib[bcrypt]

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/budgetflow_test
          SECRET_KEY: test_secret_key_change_me_in_prod
          ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/unit -v

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/budgetflow_test
          SECRET_KEY: test_secret_key_change_me_in_prod
          ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest tests/integration -v
