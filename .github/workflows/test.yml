name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Unit & Integration Tests + Coverage
  # ============================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: budget_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx sqlalchemy psycopg2-binary pydantic-settings python-multipart python-jose[cryptography] passlib[bcrypt] bcrypt alembic python-dotenv pytest-mock pytest-asyncio pytest-anyio typing-extensions requests anyio sniffio idna certifi urllib3 charset-normalizer

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budget_flow_test
          JWT_SECRET: test-secret-key-for-github-actions-1234567890
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest tests/unit -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budget_flow_test
          JWT_SECRET: test-secret-key-for-github-actions-1234567890
          ENVIRONMENT: testing
        run: |
          cd backend
          pytest tests/integration -v --tb=short --cov=app --cov-append --cov-report=xml --cov-branch

      - name: Print Coverage Summary
        run: |
          cd backend
          python -m coverage report --fail-under=75 || echo "Coverage below 75% threshold"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ============================================
  # Mutation Testing (reconciliation_service)
  # Runs on main/develop only to save CI time
  # ============================================
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: budget_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies + mutmut
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mutmut pytest pytest-cov httpx sqlalchemy psycopg2-binary pydantic-settings python-multipart python-jose[cryptography] passlib[bcrypt] bcrypt alembic python-dotenv pytest-mock pytest-asyncio pytest-anyio typing-extensions requests anyio sniffio idna certifi urllib3 charset-normalizer

      - name: Run mutation tests on reconciliation_service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/budget_flow_test
          JWT_SECRET: test-secret-key-for-github-actions-1234567890
          ENVIRONMENT: testing
        run: |
          cd backend
          # Run mutmut on the financial-critical reconciliation service
          mutmut run --paths-to-mutate=app/services/reconciliation_service.py \
            --runner="python -m pytest tests/unit/test_reconciliation_service.py tests/integration/test_reconciliation.py -x -q" \
            --no-progress || true
          # Report results (don't fail CI on surviving mutants, just report)
          echo "=== Mutation Testing Results ==="
          mutmut results || true
          echo "=== Mutation Score ==="
          mutmut junitxml > mutmut_report.xml 2>/dev/null || true
          KILLED=$(mutmut results 2>/dev/null | grep -c "Killed" || echo 0)
          SURVIVED=$(mutmut results 2>/dev/null | grep -c "Survived" || echo 0)
          TOTAL=$((KILLED + SURVIVED))
          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$(echo "scale=1; $KILLED * 100 / $TOTAL" | bc)
            echo "Mutation score: ${SCORE}% (${KILLED}/${TOTAL} mutants killed)"
            if [ "$KILLED" -lt $(echo "$TOTAL * 70 / 100" | bc) ]; then
              echo "WARNING: Mutation score below 70% target"
            fi
          fi

      - name: Upload mutmut results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            backend/.mutmut-cache
            backend/mutmut_report.xml
          retention-days: 7

  # ============================================
  # End-to-End Tests (only on main/develop)
  # ============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test  # Only run if unit/integration tests pass
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create .env file
        run: |
          echo "DB_PASSWORD=postgres" > .env
          echo "JWT_SECRET=e2e-test-secret-key-1234567890" >> .env

      - name: Start services
        run: |
          docker-compose up -d --build
          sleep 45  # Wait for services to be fully ready

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/api/v1/system/health; then
              echo "Backend ready"
              break
            fi
            echo "Waiting for backend... attempt $i/12"
            sleep 5
          done
          curl -f http://localhost:8000/api/v1/system/health || exit 1

      - name: Check service status
        run: docker-compose ps

      - name: Install Playwright
        run: |
          pip install pytest-playwright pytest
          playwright install chromium --with-deps

      - name: Run Core E2E Tests (Auth + Happy Path)
        run: |
          pytest tests/e2e/test_login_experience.py tests/e2e/test_auth_edge_cases.py \
            -v --tb=short --timeout=120
        continue-on-error: false

      - name: Run Budget Flow E2E Tests
        run: |
          pytest tests/e2e/test_budget_flow.py tests/e2e/test_multi_currency_flow.py \
            -v --tb=short --timeout=180
        continue-on-error: true

      - name: Run New E2E Flow Tests
        run: |
          pytest tests/e2e/flows/ -v --tb=short --timeout=180 -x
        continue-on-error: true

      - name: Run E2E Edge Case Tests
        run: |
          pytest tests/e2e/edge_cases/ -v --tb=short --timeout=120
        continue-on-error: true

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker-compose logs backend --tail=100
          docker-compose logs frontend --tail=50

      - name: Stop services
        if: always()
        run: docker-compose down -v

  # ============================================
  # Code Quality Checks
  # ============================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install black isort flake8 mypy

      - name: Check formatting with Black
        run: |
          cd backend
          black --check --diff app tests
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          cd backend
          isort --check-only --diff app tests
        continue-on-error: true

      - name: Run flake8
        run: |
          cd backend
          flake8 app --max-line-length=100 --ignore=E501,W503
        continue-on-error: true
